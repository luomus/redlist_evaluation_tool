version: "3.8"
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_DB=redlisttool
      - POSTGRES_USER=redlisttool
      - POSTGRES_PASSWORD=redlisttool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redlisttool -d redlisttool -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - .:/app:rw
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://redlisttool:redlisttool@db:5432/redlisttool
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - USE_AUTHENTICATION=${USE_AUTHENTICATION:-false}
      - MML_API_KEY=${MML_API_KEY:-}
      - LAJI_API_BASE_URL=${LAJI_API_BASE_URL:-}
      - LAJI_API_ACCESS_TOKEN=${LAJI_API_ACCESS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
