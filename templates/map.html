<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ taxon.name }} – Karttanäkymä</title>
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <link rel="stylesheet" href="/static/css/map.css">
    <link rel="stylesheet" href="/static/css/data-panel-buttons.css">
    <link rel="stylesheet" href="/static/css/data-panel-popups.css">
</head>
<body>
    <header>
        <div class="panels-container">
            <!-- Info Panel: Taxon info and EOO data -->
            <div class="info-panel">
                <h3>{{ taxon.name }}</h3>
                {% if taxon.category %}
                <div class="info-item">
                    <span class="info-label">Luokka:</span>
                    <span class="info-value">{{ taxon.category }}</span>
                </div>
                {% endif %}
                {% if taxon.elio_ryhma %}
                <div class="info-item">
                    <span class="info-label">Eliöryhmä:</span>
                    <span class="info-value">{{ taxon.elio_ryhma }}</span>
                </div>
                {% endif %}
                <div class="info-item">
                    <span class="info-label">Havaintoja ladattu:</span>
                    <span class="info-value" id="observationCount">-</span>
                </div>
            </div>
            <div class="aoo-panel">
                <div class="info-item">
                    <span class="info-label">Ruutuja yht:</span>
                    <span class="info-value" id="cellsCount">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Laskettu:</span>
                    <span class="info-value" id="aoo_calculated_at">-</span>
                </div>
                <button id="genBtn" onclick="window.createGrid(false)" style="margin-top: 10px; padding: 8px 16px; background: #3388ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%;">&#8635; Laske esiintymisalue</button>
            </div>
            
            <div class="eoo-panel">
                <div class="info-item eoo-row" style="margin-top: 12px;">
                    <span class="eoo-left">
                        <span class="info-label" style="color:#ff7800;">&#9632;</span>
                        <span class="info-label">Laaja EOO:</span>
                        <span class="eoo-info" data-tip="Laaja levinneisyysalue (EOO). Lasketaan niin, että sisältää kaikkien geometrioiden kaikki pisteet.">?</span>
                    </span>
                    <span class="info-value" id="areaMax">-</span>
                </div>
                <div class="info-item eoo-row">
                    <span class="eoo-left">
                        <span class="info-label" style="color:#3388ff;">&#9632;</span>
                        <span class="info-label">Minimaalinen EOO:</span>
                        <span class="eoo-info" data-tip="Minimaalinen levinneisyysalue (EOO). Lasketaan vain aluemuotoisten havaintojen lähin nurkkaus.">?</span>
                    </span>
                    <span class="info-value" id="areaMin">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Laskettu:</span>
                    <span class="info-value" id="calculated_at">-</span>
                </div>
                <button id="recalcBtn" onclick="window.createConvexHull(false)" style="margin-top: 10px; padding: 8px 16px; background: #3388ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%;">&#8635; Laske levinneisyysalueet</button>
            </div>

            <!-- Data Download Panel -->
            <div class="data-download-panel">
                <div id="mapDatasets" style="margin-bottom: 12px;">Ladataan…</div>
                
                <button onclick="openCsvUploadPopup()" class="data-panel-button btn-csv-upload">📁 Lataa CSV koneelta</button>
                <button onclick="openLajifiPopup()" class="data-panel-button btn-lajifi">🌐 Lataa laji.fi:stä</button>
                
                <!-- Hidden elements for reload functionality -->
                <div id="mapFetchProgress" style="display:none;"></div>
                <div id="mapProgressLog" style="display:none;"></div>
                <div id="mapSaveSection" style="display:none;"></div>
            </div>
        </div>

        <div id="status" class="stats">Ladataan aineistoa…</div>
        <div id="mapError" class="map-error-message" style="display: none;"></div>
    </header>

    <div id="map"></div>

    <script>window.MX_ID = "{{ taxon.mx_id }}";</script>
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.2/proj4.min.js"></script>
    <script src="/static/js/map-shared.js"></script>
    <script src="/static/js/map-elements.js"></script>
    <script src="/static/js/fetch_data.js"></script>
    <script src="/static/js/data-panel-popups.js"></script>
    <script src="/static/js/map.js"></script>
</body>
</html>
